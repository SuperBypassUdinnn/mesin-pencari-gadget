services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gadget_search_backend
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./models/cache:/app/models/cache
      - ./evaluation_results:/app/evaluation_results
    environment:
      - PYTHONUNBUFFERED=1
      - TORCH_HOME=/app/models/cache
      - TRANSFORMERS_CACHE=/app/models/cache
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gadget_search_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
