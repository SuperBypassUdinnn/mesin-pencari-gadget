name: CI Test Suite

on:
  push:
    branches: [ main, "feature/**" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest httpx

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          pytest tests/ -v

      - name: Test Offline Indexer and Evaluator
        env:
          PYTHONPATH: .
        run: |
          python3 -m backend.app.engine.indexer
          python3 -m backend.app.engine.evaluator

  frontend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Frontend Vitest Suite
        working-directory: frontend
        run: npm test -- --run

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: npm run build
